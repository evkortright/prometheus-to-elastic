<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="450" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Bridge State — Prometheus + Grafana + Elastic Serverless (Modules 1–3)</text>

  <!-- App services (collapsed) -->
  <rect x="200" y="52" width="500" height="64" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="450" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">OTel Astronomy Shop</text>
  <text x="450" y="96" text-anchor="middle" font-size="11" fill="#0F6E56">16 microservices — fully OTLP instrumented — load generator included</text>

  <!-- OTLP arrow down -->
  <line x1="450" y1="116" x2="450" y2="158" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="472" y="142" font-size="11" fill="#185FA5">OTLP push</text>

  <!-- OTel Collector -->
  <rect x="200" y="162" width="500" height="70" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <text x="450" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="#26215C">OTel Collector</text>
  <text x="450" y="208" text-anchor="middle" font-size="11" fill="#3C3489">Span metrics · infra scrapes · exposes :9464/metrics for Prometheus to pull</text>

  <!-- Scrape arrow down -->
  <line x1="450" y1="232" x2="450" y2="278" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="472" y="260" font-size="11" fill="#555">scrape pull</text>

  <!-- Prometheus -->
  <rect x="260" y="282" width="380" height="72" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
  <text x="450" y="308" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A1B0C">Prometheus</text>
  <text x="450" y="326" text-anchor="middle" font-size="11" fill="#712B13">Local TSDB + remote_write fan-out</text>
  <text x="450" y="342" text-anchor="middle" font-size="11" fill="#712B13">:9090  ·  prometheus.yml — one extra block added</text>

  <!-- PromQL left to Grafana -->
  <path d="M260 318 L140 318 L140 406 L168 406" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="84" y="368" text-anchor="middle" font-size="11" fill="#BA7517">PromQL</text>
  <text x="84" y="382" text-anchor="middle" font-size="11" fill="#BA7517">(unchanged)</text>

  <!-- Grafana -->
  <rect x="168" y="382" width="160" height="70" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
  <text x="248" y="408" text-anchor="middle" font-size="14" font-weight="bold" fill="#412402">Grafana</text>
  <text x="248" y="426" text-anchor="middle" font-size="11" fill="#633806">Unchanged</text>
  <text x="248" y="443" text-anchor="middle" font-size="11" fill="#633806">Still works ✓</text>

  <!-- remote_write right to Elastic -->
  <path d="M640 318 L760 318 L760 382" fill="none" stroke="#0F6E56" stroke-width="2" stroke-dasharray="0" marker-end="url(#arr-green)"/>
  <rect x="670" y="296" width="46" height="20" rx="10" fill="#1D9E75"/>
  <text x="693" y="310" text-anchor="middle" font-size="10" font-weight="bold" fill="#E1F5EE">NEW</text>
  <text x="775" y="344" font-size="11" fill="#0F6E56">remote_write</text>
  <text x="775" y="358" font-size="11" fill="#0F6E56">/_prometheus/</text>
  <text x="775" y="372" font-size="11" fill="#0F6E56">api/v1/write</text>

  <!-- Elastic Serverless -->
  <rect x="680" y="382" width="200" height="90" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="2"/>
  <text x="780" y="408" text-anchor="middle" font-size="14" font-weight="bold" fill="#04342C">Elastic Serverless</text>
  <text x="780" y="426" text-anchor="middle" font-size="10" fill="#085041">metrics-generic.prometheus-*</text>
  <text x="780" y="442" text-anchor="middle" font-size="11" fill="#085041">PromQL  ·  ES|QL  ·  Kibana</text>
  <text x="780" y="458" text-anchor="middle" font-size="10" fill="#0F6E56">Observability project</text>

  <!-- Single change callout -->
  <rect x="40" y="490" width="820" height="52" rx="6" fill="#EAF3DE" stroke="#639922" stroke-width="1.5"/>
  <text x="450" y="512" text-anchor="middle" font-size="13" font-weight="bold" fill="#173404">The only change: add one remote_write block to prometheus.yml</text>
  <text x="450" y="531" text-anchor="middle" font-size="11" fill="#3B6D11">No changes to the OTel Collector · No changes to Grafana · No changes to app services · Grafana keeps working identically</text>
</svg>
